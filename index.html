<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strong Ninja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: energiek, kort, als een coach in je broekzak; voor tieners
   IDEA: een dojo-gordelkaart, elke dag verdien je XP richting zwarte gordel
   PICTURE: lichaamskaart waarop spiergroepen rood oplichten naarmate je ze traint; de sixpack vult zich blok per blok
   COLOUR and TYPE: wit/bijna-zwart, dojo-rood als enige accent, gordelkleuren voor levels; Anton titels, Inter tekst
   LAYOUT: drie tabs (Vandaag, Train, Progressie); boven: lichaam + dagring naast elkaar, op gsm gestapeld */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1013);--ink:light-dark(#121316,#f1f1f3);--mut:light-dark(#62656e,#9a9ca5);--card:light-dark(#f3f3f5,#1a1b20);--line:light-dark(#e2e2e7,#2b2c33);--red:#d7263d;--redsoft:light-dark(#fde8eb,#3a1418)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:14px max(5vw,16px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:Anton,sans-serif;font-size:26px;letter-spacing:.5px}.logo b{color:var(--red);font-weight:400}
.belt{display:flex;align-items:center;gap:8px;margin-inline-start:auto;font-weight:600;font-size:14px}
.belt i{display:block;width:34px;height:12px;border-radius:3px;border:1px solid var(--line)}
.lang{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
nav{display:flex;gap:6px;padding:10px max(5vw,16px);position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;max-width:200px;min-height:44px;border:0;border-radius:12px;background:var(--card);font-weight:800}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,40px) max(5vw,16px) 120px}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,40px);align-items:center}
.body{background:var(--card);border-radius:24px;padding:18px;display:flex;justify-content:center}
.body svg{width:100%;max-width:300px;height:auto}
.m{stroke:var(--line);stroke-width:1.5;transition:fill-opacity .6s}
.ring{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring svg{width:150px;height:150px;flex:none}
.big{font-family:Anton,sans-serif;font-size:clamp(40px,7vw,64px);line-height:1}
.mut{color:var(--mut);font-size:14px}
.xpbar{height:12px;background:var(--card);border-radius:99px;overflow:hidden;margin:8px 0 4px}.xpbar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .6s}
.quests{display:grid;gap:10px;margin-top:22px}
.q{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:none;text-align:start;min-height:64px;width:100%}
.q.done{background:var(--redsoft);border-color:var(--red)}
.q .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.q.done .ck{background:var(--red);border-color:var(--red)}
.q .tx{flex:1}.q .tx b{display:block}.q .xp{font-weight:800;color:var(--red);white-space:nowrap}
.cnt{display:flex;gap:6px;align-items:center}.cnt button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:20px}
h2{font-size:clamp(32px,5vw,46px)}h3{font-size:24px;margin-bottom:10px}
.progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.prog{border:2px solid var(--line);border-radius:18px;padding:16px;background:none;text-align:start;min-height:96px}
.prog[aria-pressed=true]{border-color:var(--red);background:var(--redsoft)}
.prog b{font-family:Anton,sans-serif;font-size:24px;font-weight:400;display:block}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ex .nm{font-weight:800}.ex .rp{color:var(--mut);font-size:14px}
.sets{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;font-weight:800;font-size:14px}
.set.on{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--red);color:#fff;font-weight:800}
.btn.alt{background:var(--card);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
.card{background:var(--card);border-radius:20px;padding:20px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--line)}
.belts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.belts span{flex:1 1 60px;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;border:1px solid var(--line)}
.fig{position:relative;min-height:170px;margin-top:10px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.log{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.log input{flex:1 1 120px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
.note{font-size:13px;color:var(--mut);margin-top:22px;max-width:70ch}
.timer{position:fixed;inset:auto 0 0 0;background:var(--ink);color:var(--bg);display:none;align-items:center;gap:16px;padding:14px max(5vw,16px);z-index:9}
.timer.on{display:flex}.timer .big{color:var(--red)}.timer button{min-height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:800}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--red);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
.setup{max-width:680px;margin:0 auto}
.fs{border:1px solid var(--line);border-radius:20px;padding:18px;margin:18px 0 0}
.fs legend{font-family:Anton,sans-serif;font-size:22px;padding:0 6px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:8px 0}
.fld input{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px;width:100%}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:none;font-weight:800}
.seg button[aria-pressed=true]{border-color:var(--red);background:var(--redsoft)}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 0;font-weight:600}
.bar .tr{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--red)}
.bar span:last-child{text-align:right;white-space:nowrap}
.hgt{font-family:Anton,sans-serif;font-size:clamp(34px,6vw,48px);line-height:1}
.err{color:var(--red);font-weight:600;min-height:1.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:none;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--red);background:var(--redsoft)}
.gearCol{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.gearCol b{margin-right:4px}.gcI{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(127,127,127,.12);font-weight:600}
.gcI small{opacity:.7;font-weight:500}.gcI.on{background:rgba(34,197,94,.15)}.gcI.on small{color:#15803d;opacity:1}
.gearOk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
button.gcI{border:0;font:inherit;color:inherit;cursor:pointer}.gcE{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px}
.gcE.x{border:0;background:#ef4444;color:#fff;font-weight:900;font-size:13px;cursor:pointer}
.gcQ{background:rgba(239,68,68,.12)}.gcB{border:0;border-radius:999px;padding:3px 10px;font-weight:700;cursor:pointer;background:rgba(127,127,127,.2);color:inherit}.gcB.y{background:#ef4444;color:#fff}
.gcE img{width:26px;height:26px;object-fit:cover;border-radius:6px;display:block}.chip.has::after{content:' ✓';opacity:.55}
.phNew{display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:8px;border:2px dashed var(--line);border-radius:12px}.phNew img{width:64px;height:64px;object-fit:cover;border-radius:10px}.phNew span{flex:1;font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.pbtn{display:inline-flex;align-items:center;cursor:pointer}
.dev{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:var(--bg)}
.dev header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dev header b{flex:1}
.dev header button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.met{background:var(--card);border-radius:12px;padding:10px}.met b{font-family:Anton,sans-serif;font-weight:400;font-size:28px;display:block;line-height:1.1;white-space:nowrap}.met span{font-size:13px;color:var(--mut)}
[hidden]{display:none!important}
@media(max-width:700px){.hero,.grid2{grid-template-columns:minmax(0,1fr)}.progs{grid-template-columns:minmax(0,1fr)}.prog{min-height:auto}.body svg{max-width:220px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">STRONG<b>.</b>NINJA</div>
  <div class="belt"><i id="beltSwatch"></i><span id="beltName"></span></div>
  <button class="lang" id="lang">EN</button>
</header>
<nav role="tablist">
  <button role="tab" data-tab="today" aria-selected="true" id="tToday">Vandaag</button>
  <button role="tab" data-tab="train" aria-selected="false" id="tTrain">Train</button>
  <button role="tab" data-tab="prog" aria-selected="false" id="tProg">Progressie</button>
</nav>
<main>
  <section id="setup" class="setup" hidden>
    <h1 style="font-size:clamp(34px,5.5vw,52px)" id="suTitle">Starttest</h1>
    <p class="mut" id="suIntro"></p>
    <form id="suForm" novalidate>
      <fieldset class="fs"><legend id="lgYou">Jij en je ouders</legend>
        <div class="seg" id="sex"><button type="button" data-sex="m" aria-pressed="true" id="sxM">Jongen</button><button type="button" data-sex="f" aria-pressed="false" id="sxF">Meisje</button></div>
        <label class="fld"><span id="lbMe">Jouw lengte (cm)</span><input id="hMe" type="number" inputmode="numeric" min="100" max="230"></label>
        <label class="fld"><span id="lbDad">Lengte papa (cm)</span><input id="hDad" type="number" inputmode="numeric" min="130" max="230"></label>
        <label class="fld"><span id="lbMom">Lengte mama (cm)</span><input id="hMom" type="number" inputmode="numeric" min="130" max="230"></label>
      </fieldset>
      <fieldset class="fs"><legend id="lgTest">Hoe sterk ben je nu?</legend>
        <p class="mut" id="testIntro"></p>
        <label class="fld"><span id="lbPush">Push-ups (max, borst en armen)</span><input id="tPush" type="number" inputmode="numeric" min="0" max="300"></label>
        <label class="fld"><span id="lbPike">Pike push-ups (max, schouders)</span><input id="tPike" type="number" inputmode="numeric" min="0" max="200"></label>
        <label class="fld"><span id="lbPlank">Plank (seconden, buik)</span><input id="tPlank" type="number" inputmode="numeric" min="0" max="1800"></label>
        <label class="fld"><span id="lbSquat">Squats in 1 minuut (benen)</span><input id="tSquat" type="number" inputmode="numeric" min="0" max="150"></label>
      </fieldset>
      <p class="err" id="suErr"></p>
      <button class="btn" id="suGo" style="width:100%">Start</button>
    </form>
  </section>

  <section id="today">
    <div class="hero">
      <div class="body" aria-label="Lichaamskaart">
        <svg viewBox="0 0 200 360" id="map">
          <circle cx="100" cy="34" r="22" fill="var(--line)"/>
          <rect x="92" y="54" width="16" height="16" rx="4" fill="var(--line)"/>
          <ellipse class="m" data-g="sh" cx="62" cy="88" rx="20" ry="14"/>
          <ellipse class="m" data-g="sh" cx="138" cy="88" rx="20" ry="14"/>
          <rect class="m" data-g="ch" x="70" y="80" width="29" height="38" rx="10"/>
          <rect class="m" data-g="ch" x="101" y="80" width="29" height="38" rx="10"/>
          <rect class="m" data-g="ar" x="36" y="104" width="20" height="58" rx="10" transform="rotate(8 46 133)"/>
          <rect class="m" data-g="ar" x="144" y="104" width="20" height="58" rx="10" transform="rotate(-8 154 133)"/>
          <rect class="m" data-g="ar" x="26" y="166" width="17" height="56" rx="8" transform="rotate(10 34 194)"/>
          <rect class="m" data-g="ar" x="157" y="166" width="17" height="56" rx="8" transform="rotate(-10 166 194)"/>
          <g id="abs"></g>
          <rect x="74" y="200" width="52" height="20" rx="8" fill="var(--line)"/>
          <rect class="m" data-g="lg" x="73" y="224" width="25" height="72" rx="11"/>
          <rect class="m" data-g="lg" x="102" y="224" width="25" height="72" rx="11"/>
          <rect class="m" data-g="lg" x="76" y="302" width="20" height="52" rx="9"/>
          <rect class="m" data-g="lg" x="104" y="302" width="20" height="52" rx="9"/>
        </svg>
      </div>
      <div>
        <h1 style="font-size:clamp(34px,5.5vw,52px)" id="hTitle">Word elke dag sterker</h1>
        <div class="ring" style="margin-top:18px">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--card)" stroke-width="14"/><circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--red)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="314" style="transition:stroke-dashoffset .6s"/><text x="60" y="68" text-anchor="middle" font-family="Anton" font-size="28" fill="currentColor" id="ringTxt">0/6</text></svg>
          <div>
            <div class="big" id="streak">0</div>
            <div class="mut" id="streakLbl">dagen streak</div>
          </div>
        </div>
        <div style="margin-top:18px"><b id="xpTxt">0 XP</b><div class="xpbar"><i id="xpFill"></i></div><div class="mut" id="xpNext"></div></div>
        <div style="margin-top:18px" id="todayStr"></div>
        <p class="mut" id="tip" style="margin-top:8px"></p>
      </div>
    </div>
    <div class="quests" id="quests"></div>
    <p class="note" id="note1"></p>
  </section>

  <section id="train" hidden>
    <div class="card" style="margin-bottom:24px">
      <h3 id="gearH">Mijn materiaal thuis</h3>
      <div class="gearCol" id="gearCol"></div>
      <p class="mut" id="gearIntro" style="margin-top:0"></p>
      <label class="btn pbtn"><span id="photoLbl">Foto trekken</span><input type="file" accept="image/*" capture="environment" id="photo" hidden></label>
      <p id="gearMsg" style="font-weight:600;min-height:1.5em;margin:10px 0 0"></p>
      <div class="thumbs" id="thumbs"></div>
      <div class="mut" id="manual"></div>
      <div class="chips" id="chips"></div>
      <div id="gearOk"></div>
    </div>
    <div class="card" style="margin-bottom:24px">
      <h3 id="btH">Toestellen via Bluetooth</h3>
      <p class="mut" id="btIntro" style="margin-top:0"></p>
      <button class="btn" id="btAdd">Toestel verbinden</button>
      <p id="btMsg" style="font-weight:600;min-height:1.5em;margin:10px 0 0"></p>
      <div id="devs"></div>
    </div>
    <h2 id="trTitle">Kies je training</h2>
    <div class="progs" id="progs"></div>
    <div id="exList"></div>
    <div class="row">
      <button class="btn" id="finish">Training afronden</button>
      <button class="btn alt" id="rest">Rust 45s</button>
    </div>
  </section>

  <section id="prog" hidden>
    <h2 id="prTitle">Jouw progressie</h2>
    <div class="grid2">
      <div class="card"><h3 id="strH">Sterkte per deel</h3><div id="strBars"></div></div>
      <div class="card"><h3 id="hgtH">Lengte</h3><div id="hgtBox"></div></div>
      <div class="card"><h3 id="beltH">Gordels</h3><div class="mut" id="beltInfo"></div><div class="belts" id="belts"></div></div>
      <div class="card"><h3 id="heatH">Laatste 28 dagen</h3><div class="heat" id="heat"></div></div>
      <div class="card"><h3 id="pushH">Max push-ups</h3><div class="fig"><svg id="cPush"></svg></div><form class="log" data-k="push"><input type="number" min="0" max="500" inputmode="numeric" id="iPush"><button class="btn">+</button></form></div>
      <div class="card"><h3 id="plankH">Langste plank (sec)</h3><div class="fig"><svg id="cPlank"></svg></div><form class="log" data-k="plank"><input type="number" min="0" max="1800" inputmode="numeric" id="iPlank"><button class="btn">+</button></form></div>
    </div>
    <div class="row"><button class="btn" id="retest">Opnieuw testen</button><button class="btn alt" id="reset">Alles resetten</button><span class="mut" id="resetAsk" hidden></span></div>
  </section>
</main>
<div class="timer" id="timer"><div class="big" id="tNum">45</div><div style="flex:1" id="tLbl">Rust</div><button id="tPlus">+15</button><button id="tStop">Stop</button></div>
<div class="toast" id="toast"></div>

<script>
{
const T={
nl:{today:'Vandaag',train:'Train',prog:'Progressie',hTitle:'Word elke dag sterker',streak:'dagen streak',next:'nog {n} XP tot {b}',max:'Zwarte gordel bereikt!',
trTitle:'Kies je training',finish:'Training afronden',rest:'Rust 45s',restLbl:'Rust, adem rustig',stop:'Stop',prTitle:'Jouw progressie',belts:'Gordels',
beltInfo:'Verdien XP met quests, trainingen en records.',heat:'Laatste 28 dagen',push:'Max push-ups',plank:'Langste plank (sec)',reset:'Alles resetten',
resetAsk:'Klik nog eens om alles te wissen.',empty:'Nog geen records. Test jezelf en log je score.',done:'Training voltooid! +60 XP',already:'Deze training staat er vandaag al op.',
logged:'Record gelogd! +5 XP',lvl:'Nieuwe gordel: {b}!',ph:'Score',
note:'Een sixpack komt van core-training, genoeg slaap en gewoon gezond eten, niet van minder eten. Je lichaam groeit vooral als je slaapt. Pijn (niet gewoon spierbranden)? Stop en vraag raad.',
q:{workout:['Train vandaag','Rond een training af in het Train-tabblad'],sleep:['8 tot 10 uur slaap','Je spieren en lengte groeien \'s nachts'],water:['6 glazen water','Tik + per glas'],
protein:['Eiwit bij elke maaltijd','Ei, kwark, kip, vis, bonen, noten'],stretch:['5 min stretchen','Houding recht, schouders naar achter'],screen:['Scherm uit voor bed','30 min zonder gsm voor je slaapt']},
p:{core:['Sixpack','Core en buikspieren'],strength:['Kracht','Push, benen, rug'],grow:['Groei','Houding, mobiliteit, springen']},
bn:['Wit','Geel','Oranje','Groen','Blauw','Paars','Bruin','Zwart'],
suTitle:'Starttest',suIntro:'Vul dit één keer in. Zo weet de app waar je al sterk bent, wat je moet trainen en hoe groot je ongeveer kan worden.',lgYou:'Jij en je ouders',sxM:'Jongen',sxF:'Meisje',
lbMe:'Jouw lengte (cm)',lbDad:'Lengte papa (cm)',lbMom:'Lengte mama (cm)',lgTest:'Hoe sterk ben je nu?',testIntro:'Doe elke test één keer, goed opgewarmd. Tel alleen herhalingen met goede techniek. Lukt er geen enkele? Vul 0 in.',

function chart(s,data){const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  if(!data.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".55" font-size="14">${t('empty')}</text>`;return}
  const v=data.map(d=>d[1]),mx=Math.max(...v)*1.15||1,p=24,n=data.length;
  const X=i=>n<2?W/2:p+(W-2*p)*i/(n-1),Y=y=>H-p-(H-2*p)*y/mx;
  const pts=v.map((y,i)=>X(i)+','+Y(y)).join(' ');const best=Math.max(...v);
  s.innerHTML=`<line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round"/>`+v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="5" fill="var(--red)"/>`).join('')+
  `<text x="${p}" y="16" font-size="13" fill="currentColor" font-weight="800">Record: ${best}</text>`}
const ro=new ResizeObserver(()=>{chart($('cPush'),S.prs.push);chart($('cPlank'),S.prs.plank)});ro.observe($('cPush'));

  if(b.dataset.eq){const k=b.dataset.eq,i=DR.indexOf(k);if(PH)DR=i<0?[k]:[];else if(i<0)DR.push(k);else DR.splice(i,1);render();return}
  if(b.dataset.phx){PH=null;DR=[];msg('');render();return}
  if(b.id==='gearConfirm'){const q=S.equip||(S.equip=[]);for(const k of DR)if(!q.includes(k))q.push(k);if(PH&&DR[0]){S.eqPhoto=S.eqPhoto||{};S.eqPhoto[DR[0]]=PH}DR=[];PH=null;save();prog='gear';render();msg(t('added'));setTimeout(()=>{const p=$('progs');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})},150);return}
  if(b.dataset.sex){sex=b.dataset.sex;render();return}
  if(b.dataset.w){withLvl(()=>{const d=D(day());d.water=Math.max(0,Math.min(12,d.water+ +b.dataset.w));d.q.water=d.water>=6});return}
  if(b.dataset.q){if(b.dataset.q==='workout'){tab='train';render();return}withLvl(()=>{const d=D(day());d.q[b.dataset.q]=!d.q[b.dataset.q]});return}
  if(b.dataset.p){prog=b.dataset.p;render();return}
  if(b.dataset.s){sets[b.dataset.s]=!sets[b.dataset.s];if(sets[b.dataset.s])startTimer(45);render();return}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.q){e.preventDefault();e.target.click()}});
$('lang').onclick=()=>{S.lang=S.lang==='nl'?'en':'nl';save();render()};
$('finish').onclick=()=>{const d=D(day());if(d.w.includes(prog)){toast(t('already'));return}withLvl(()=>{d.w.push(prog);d.q.workout=true});toast(t('done'));for(const k in sets)if(k.startsWith(prog))delete sets[k];render()};
function startTimer(sec){tLeft=sec;$('timer').classList.add('on');$('tNum').textContent=tLeft;clearInterval(timerId);timerId=setInterval(()=>{tLeft--;$('tNum').textContent=tLeft;if(tLeft<=0){clearInterval(timerId);$('timer').classList.remove('on')}},1000)}
$('rest').onclick=()=>startTimer(45);
$('tPlus').onclick=()=>{tLeft+=15;$('tNum').textContent=tLeft};
$('tStop').onclick=()=>{clearInterval(timerId);$('timer').classList.remove('on')};
document.querySelectorAll('form.log').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const i=f.querySelector('input'),v=parseInt(i.value,10);if(!(v>0))return;withLvl(()=>S.prs[f.dataset.k].push([day(),v]));i.value='';toast(t('logged'))}));
$('reset').onclick=()=>{if(!resetArm){resetArm=true;$('resetAsk').hidden=false;setTimeout(()=>{resetArm=false;$('resetAsk').hidden=true},4000);return}S={lang:S.lang,days:{},prs:{push:[],plank:[]}};save();resetArm=false;$('resetAsk').hidden=true;render()};
const F={me:'hMe',dad:'hDad',mom:'hMom',push:'tPush',pike:'tPike',plank:'tPlank',squat:'tSquat'};
$('suForm').addEventListener('submit',e=>{e.preventDefault();const p={sex};
  for(const[k,id]of Object.entries(F)){const el=$(id),v=parseInt(el.value,10);if(isNaN(v)||v<+el.min||v>+el.max){$('suErr').textContent=t('suErr');el.focus();return}p[k]=v}
  $('suErr').textContent='';S.profile=p;save();tab='today';render();window.scrollTo(0,0)});
$('retest').onclick=()=>{const p=S.profile;sex=p.sex;for(const[k,id]of Object.entries(F))$(id).value=p[k];S.profile=null;tab='setup';render();S.profile=p;window.scrollTo(0,0)};
if(S.profile)sex=S.profile.sex;
const DEVS=new Map();
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderDevs(){const L=T[S.lang];$('devs').innerHTML=[...DEVS.entries()].map(([id,d])=>{const v=d.v,sec=Math.round((Date.now()-d.t0)/1000);
  const mets=Object.keys(L.m).filter(k=>v[k]!=null).map(k=>`<div class="met"><b>${v[k]}</b><span>${L.m[k]}</span></div>`).join('')+`<div class="met"><b>${fmtT(sec)}</b><span>${L.m.time}</span></div>`;
  return `<div class="dev"><header><b>${d.name.replace(/[<&>]/g,'')}</b>${d.lost?`<span class="mut">${L.btLost}</span>`:''}<button data-dc="${id}">${L.btDisc}</button></header><div class="mets">${mets}</div></div>`}).join('')}
setInterval(()=>{if(DEVS.size&&tab==='train')renderDevs()},1000);
function rd(dv){let o=0;const u8=()=>dv.getUint8(o++),u16=()=>{const x=dv.getUint16(o,true);o+=2;return x},s16=()=>{const x=dv.getInt16(o,true);o+=2;return x},u24=()=>{const x=dv.getUint16(o,true)|(dv.getUint8(o+2)<<16);o+=3;return x};return{u8,u16,s16,u24}}
const PARSE={
0x2a37:(dv,v)=>{const f=dv.getUint8(0);v.hr=f&1?dv.getUint16(1,true):dv.getUint8(1)},
0x2a63:(dv,v)=>{v.w=dv.getInt16(2,true)},
0x2ad2:(dv,v)=>{const r=rd(dv),f=r.u16();if(!(f&1))v.kmh=(r.u16()/100).toFixed(1);if(f&2)r.u16();if(f&4)v.rpm=Math.round(r.u16()/2);if(f&8)r.u16();if(f&16)v.dist=r.u24();if(f&32)r.s16();if(f&64)v.w=r.s16();if(f&128)r.s16();if(f&256){v.kcal=r.u16();r.u16();r.u8()}if(f&512)v.hr=r.u8()},
0x2ad1:(dv,v)=>{const r=rd(dv),f=r.u16();if(!(f&1)){v.spm=Math.round(r.u8()/2);r.u16()}if(f&2)r.u8();if(f&4)v.dist=r.u24();if(f&8)r.u16();if(f&16)r.u16();if(f&32)v.w=r.s16();if(f&64)r.s16();if(f&128)r.s16();if(f&256){v.kcal=r.u16();r.u16();r.u8()}if(f&512)v.hr=r.u8()},
0x2acd:(dv,v)=>{const r=rd(dv),f=r.u16();if(!(f&1))v.kmh=(r.u16()/100).toFixed(1);if(f&2)r.u16();if(f&4)v.dist=r.u24();if(f&8){r.s16();r.s16()}if(f&16){r.u16();r.u16()}if(f&32)r.u8();if(f&64)r.u8();if(f&128){v.kcal=r.u16();r.u16();r.u8()}if(f&256)v.hr=r.u8()}};
const SVC={0x180d:[0x2a37],0x1826:[0x2ad2,0x2ad1,0x2acd],0x1818:[0x2a63]};
$('btAdd').onclick=async()=>{const bm=m=>{$('btMsg').textContent=m};
  if(!navigator.bluetooth){bm(t('btNo'));return}
  let dev;try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:Object.keys(SVC).map(Number)})}
  catch(e){if(e&&e.name==='NotFoundError')return;bm(e&&e.name==='SecurityError'?t('btBlocked'):t('btNo'));return}
  const name=dev.name||'Bluetooth';bm(t('btConn').replace('{n}',name));
  try{const srv=await dev.gatt.connect();const d={name,dev,v:{},t0:Date.now(),lost:false};let n=0;
    for(const[sv,chs]of Object.entries(SVC)){let s;try{s=await srv.getPrimaryService(+sv)}catch(e){continue}
      for(const c of chs){try{const ch=await s.getCharacteristic(c);ch.addEventListener('characteristicvaluechanged',ev=>{try{PARSE[c](ev.target.value,d.v);if(d.v.hr)d.v.maxhr=Math.max(d.v.maxhr||0,d.v.hr)}catch(x){}});await ch.startNotifications();n++}catch(e){}}}
    if(!n){bm(t('btNoSvc'));dev.gatt.disconnect();return}
    dev.addEventListener('gattserverdisconnected',()=>{d.lost=true;renderDevs()});
    DEVS.set(dev.id||name+Date.now(),d);bm(t('btOk').replace('{n}',name));renderDevs();
  }catch(e){bm(t('btNoSvc'))}};
let sampleFn=null;
if(window.claude&&claude.use)claude.use('sample').then(f=>{sampleFn=f}).catch(()=>{});
const msg=k=>{$('gearMsg').textContent=k};
async function shrink(file,max,q){const bmp=await createImageBitmap(file);const r=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return{c,blob:await new Promise(res=>c.toBlob(res,'image/jpeg',q))}}
$('photo').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let big;try{big=await shrink(f,768,.8);const th=await shrink(f,120,.7);PH=th.c.toDataURL('image/jpeg',.7);DR=[];render();msg(t('phQ'))}catch(err){msg(t('noAI'));return}
  try{if(!sampleFn||!(await sampleFn.limits()).images){msg(t('noAI'));return}}catch(err){msg(t('noAI'));return}
  msg(t('scanning'));
  try{const ids=Object.keys(EQ);
    const r=await sampleFn.json('This is a photo taken inside someone\'s home. Which home sports or fitness equipment is visible? Choose only from these ids: '+ids.join(', ')+'. Answer only JSON: {"items":["id"]}. Use an empty list if none of these is clearly visible.',{images:[big.blob],modelTier:'quick'});
    const found=((r&&r.items)||[]).filter(i=>EQ[i]);
    if(!found.length){msg(t('none'));return}
    DR=[found[0]];render();
    msg(t('foundD').replace('{x}',found.map(k=>EQ[k][0][S.lang==='en'?1:0]).join(', ')));
  }catch(err){msg(err&&err.code==='rate_limited'?t('none'):t('noAI'))}
});
render();
}
